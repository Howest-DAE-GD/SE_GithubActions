name: '[Example 10] Gist Badge Json'
run-name: '[Example 10] Update JSON contents of a Gist'

on: 
  workflow_dispatch: 
    inputs:
        label:
            required: false
            default: label
        message:
            required: false
            default: message
        color:
            required: false
            default: orange
        logo:
            required: false
            default: github
        logo-color:
            required: false
            default: f5f5f5
        file-name:
            required: false
            default: badge
        gist-id:
            required: true

jobs:
    create-badge:
        runs-on: ubuntu-latest
        steps:
            - name: Create Badge
              uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
              with:
                auth: ${{ secrets.GIST_SCOPE_TOKEN }}
                gistID: ${{ inputs.gist-id }}
                filename: ${{ inputs.file-name }}.json
                label: ${{ inputs.label }}
                message: ${{ inputs.message }}
                color: ${{ inputs.color }}
                namedLogo: ${{ inputs.logo }}
                logoColor: ${{ inputs.logo-color }}